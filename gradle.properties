# Project
# The mod version. Jars are named <minecraft_version>-<mod_version>, the same as the release tag (e.g. 1.21.1-1.0.0).
# (This also helps for bug reports as the version number gives us a clue as to what version of Minecraft the bug happened on)
mod_version = 1.0.0
mod_name = Hammerspace
mod_id = hammerspace
mod_archive_name = hammerspace
mod_description = Tiered pockets that hold huge stacks of a few kinds of item. Based on /dank/null by p455w0rd.
mod_group = zone.moddev.mc.hammerspace
mod_authors = Cleverpanda, MMD
mod_credits = Based on /dank/null by p455w0rd (MIT licence).
mod_license = LGPL-2.1-only
curseforge_id = 0
update_url = https://raw.githubusercontent.com/Cleverpanda/Hammerspace/refs/heads/main/update.json
issue_url = https://github.com/Cleverpanda/Hammerspace/issues

# Dependencies
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.22)
neoforge_version = 21.1.265
neoforge_version_range = [21.1,)
loader_version_range = [3,)

# Parchment (parameter names + javadocs on top of Mojang mappings)
# Versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version = 1.21.1
parchment_mappings_version = 2024.11.17

# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.configuration-cache = false
org.gradle.caching = true
org.gradle.parallel = false

# Optional integrations (compile against the API; loaded at runtime only in the test runs)
jei_version=19.21.2.313
jade_version=eYz2YBGT
